[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-ask"
dynamic = ["version"]
description = "Ask your Paperless-ngx library questions in plain language, answered with citations by a local Ollama model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["paperless-ngx", "ollama", "rag", "self-hosted", "document-search"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
paperless-ask = "paperless_ask.__main__:main"

[tool.setuptools]
packages = ["paperless_ask"]

[tool.setuptools.dynamic]
version = { attr = "paperless_ask.__version__" }

[tool.setuptools.package-data]
paperless_ask = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
